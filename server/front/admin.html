<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tineke Keramiek - Admin: Upload Post</title>
  <link rel="stylesheet" href="/assets/libs/bootstrap-3.3.7-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/styles/style.css">
  <script src="https://unpkg.com/imagesloaded@4/imagesloaded.pkgd.min.js"></script>
  <script src="/assets/libs/jquery-3.1.1.min.js"></script>
  <script src="/assets/libs/bootstrap-3.3.7-dist/js/bootstrap.min.js"></script>
  <script src="/assets/libs/masonry-layout/dist/masonry.pkgd.min.js"></script>
  <script src="/assets/libs/handlebars-v4.0.5.js"></script>
  <script>
    // Admin page - upload post and images
    document.addEventListener('DOMContentLoaded', function() {
      const postForm = document.getElementById('new-post-form');
      const titleInput = document.getElementById('title');
      const textInput = document.getElementById('text');
      const categoryInput = document.getElementById('category');
      const imageInputs = document.querySelectorAll('#images-container input');
      const progressBar = document.getElementById('upload-progress');
      
      let currentImageIndex = 0;
      let progress = 0;
      
      // Initialize progress bar
      progressBar.style.width = '0%';
      
      postForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const title = titleInput.value.trim();
        const text = textInput.value.trim();
        const category = categoryInput.value.trim();
        
        if (!title || !text) {
          alert('Please fill in title and text');
          return;
        }
        
        // Build the form data for post creation
        const formData = {
          title: title,
          text: text,
          category: category || '',
          userId: 'admin'
        };
        
        // Send the post creation request
        fetch('/api/posts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            // Now upload images one by one using the server-generated post ID
            for (let i = 0; i < imageInputs.length; i++) {
              if (imageInputs[i].files && imageInputs[i].files.length > 0) {
                uploadImage(imageInputs[i], data.id);
                currentImageIndex = i;
              }
            }
            
            // Show success message
            alert('Post created successfully!');
            // Optionally redirect or show post list
          } else {
            alert('Failed to create post. Error: ' + data.error);
          }
        })
        .catch(err => {
          alert('Error creating post: ' + err.message);
        });
      });
      
      // Function to upload an image with the given postId
      function uploadImage(fileInput, postId) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const file = e.target.file;
          
          if (!file) return;
          
          // Create FormData for multer-compatible upload
          const formData = new FormData();
          formData.append('postId', postId);
          formData.append('file', file);
          
          // Upload image
          fetch('/api/images/upload', {
            method: 'POST',
            body: formData
          })
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              progress = Math.floor((currentImageIndex + 1) / imageInputs.length * 100);
              progressBar.style.width = progress + '%';
              // Update UI if needed
              console.log('Image uploaded successfully:', data.data);
            } else {
              alert('Failed to upload image: ' + data.error);
              progressBar.style.width = '0%';
            }
          })
          .catch(err => {
            alert('Error uploading image: ' + err.message);
            progressBar.style.width = '0%';
          });
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
      }
    });
  </script>
</head>

<body>
  <header id="main-banner">
    <div class="container-fluid">
      <div id="logo-container">
        <h1>Tineke Keramiek</h1>
      </div>
    </div>
  </header>
  
  <nav class="navbar navbar-default">
    <div class="container-fluid"> 
      <div class="navbar-header">
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#nav-menu" aria-expanded="false">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand" href="/admin">Tineke Keramiek</a>
      </div>

      <div class="collapse navbar-collapse" id="nav-menu">
        <ul class="nav navbar-nav">
          <li><a href="/admin">Admin Upload</a></li>
          <li><a href="/werk">Werk</a></li>
          <li><a href="/info">Info</a></li>
        </ul>
      </div>
    </div>
  </nav>
  
  <div class="container">
    
    <div class="row component" id="admin-upload">
      <div class="col-xxs-12 col-sm-8">
        <h2>Upload New Post</h2>
        
        <form id="new-post-form" class="row row-gap">
          <div class="col-xxs-12">
            <div class="form-group">
              <label for="title">Title</label>
              <input type="text" id="title" name="title" class="form-control" placeholder="Post title" required>
            </div>
          </div>
          <div class="col-xxs-12">
            <div class="form-group">
              <label for="text">Content</label>
              <textarea id="text" name="text" class="form-control" placeholder="Write your post content" rows="8" required></textarea>
            </div>
          </div>
          <div class="col-xxs-12">
            <div class="form-group">
              <label for="category">Category</label>
              <input type="text" id="category" name="category" class="form-control" placeholder="e.g., dierfiguren, schalen">
            </div>
          </div>
          
          <div class="col-xxs-12">
            <h4>Images (up to 4)</h4>
            <div class="row">
              <div class="col-xxs-4">
                <div class="form-group">
                  <label for="image-1">Image 1</label>
                  <input type="file" id="image-1" name="image-1" class="form-control">
                </div>
              </div>
              <div class="col-xxs-4">
                <div class="form-group">
                  <label for="image-2">Image 2</label>
                  <input type="file" id="image-2" name="image-2" class="form-control">
                </div>
              </div>
              <div class="col-xxs-4">
                <div class="form-group">
                  <label for="image-3">Image 3</label>
                  <input type="file" id="image-3" name="image-3" class="form-control">
                </div>
              </div>
            </div>
            <div class="col-xxs-4">
              <div class="form-group">
                <label for="image-4">Image 4</label>
                <input type="file" id="image-4" name="image-4" class="form-control">
              </div>
            </div>
          </div>
          
          <div class="col-xxs-12">
            <div class="row">
              <div class="col-xxs-12">
                <button type="submit" class="btn btn-primary">Upload Post</button>
              </div>
            </div>
          </div>
        </form>
        
        <div id="upload-progress" class="mt-3">
          Uploading images...
        </div>
        
        <div id="result-message" class="mt-3" style="display: none;"></div>
      </div>
    </div>
    
    <!-- Admin-only footer if needed -->
    <footer class="component" id="admin-footer">
      <div id="admin-footer-content">
        <p>Admin interface for Tineke Keramiek</p>
      </div>
    </footer>
  </div>
  
  <script>
    // Simple admin-specific JS if needed
    // (Could be extended for admin-only features)
  </script>

</body>
</html>
